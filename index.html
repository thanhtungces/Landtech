<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Tung_LandTech</title>
  <!-- cài lên màn hình chính iPhone / iPad -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LandTech">
  <meta name="theme-color" content="#0F3D5E">
  <meta name="format-detection" content="telephone=no">
  <link rel="stylesheet" href="lib/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="map"></div>
  <div id="crosshair" class="hidden"></div>

  <header id="topbar">
    <button id="btnOpen" class="primary" title="Mở file">＋ Mở file</button>
    <button id="btnProj" title="Lưu / mở dự án">📁 Dự án</button>
    <button id="btnLayers" title="Các lớp">☰ Lớp <span id="layerCount" class="badge">0</span></button>
    <button id="btnCrs" title="Hệ tọa độ">⌖ Hệ tọa độ</button>
    <button id="btnBase" title="Bản đồ nền">🛰 Nền</button>
    <button id="btnSearch" title="Tra cứu tờ - thửa - chủ">🔍 Tra cứu</button>
    <button id="btnAbout" title="Giới thiệu / bản quyền">ⓘ</button>
  </header>

  <div id="fab">
    <button id="btnGps" title="Vị trí của tôi">◎</button>
    <button id="btnMeasure" title="Đo khoảng cách / diện tích">📏</button>
    <button id="btnCross" title="Tọa độ tâm màn hình">✛</button>
    <button id="btnTime" title="Xem lùi thời gian ảnh vệ tinh">🕘</button>
  </div>

  <div id="coordBox" class="hidden"></div>
  <section id="fInfo" class="hidden"></section>
  <div id="measureBox" class="hidden">
    <div id="measureText">Chạm lên bản đồ để thêm điểm</div>
    <div class="row"><button id="mUndo">↶ Lùi</button><button id="mClear">Xóa</button><button id="mClose">Đóng</button></div>
  </div>

  <input type="file" id="fileInput" multiple hidden>

  <!-- Bảng trượt -->
  <section id="sheet" class="hidden">
    <div class="sheet-head"><h2 id="sheetTitle"></h2><button id="sheetClose" aria-label="Đóng">✕</button></div>
    <div id="sheetBody"></div>
  </section>

  <div id="loading" class="hidden"><div class="spinner"></div><div id="loadingText">Đang xử lý…</div></div>
  <div id="toast" class="hidden"></div>

  <script src="js/license.js"></script>
  <script src="lib/leaflet.js"></script>
  <script src="lib/proj4.js"></script>
  <script src="lib/shp.js"></script>
  <script src="lib/dxf-parser.js"></script>
  <script src="lib/fflate.js"></script>
  <script src="js/crs.js"></script>
  <script src="js/cad.js"></script>
  <script src="js/dgn.js"></script>
  <script src="js/ole.js"></script>
  <script src="js/dgn8.js"></script>
  <script src="js/gdb.js"></script>
  <script src="js/loaders.js"></script>
  <script src="js/export.js"></script>
  <script src="js/fastlayer.js"></script>
  <script src="js/textlayer.js"></script>
  <script src="js/landuse.js"></script>
  <script src="js/attr.js"></script>
  <script src="js/polygonize.js"></script>
  <script src="js/wayback.js"></script>
  <script src="js/findnav.js"></script>
  <script src="js/app.js"></script>
  <script>
    // bản web / iPhone: chạy offline + xin giữ dữ liệu lâu dài (bản Android không cần)
    if (!window.AndroidBridge && location.protocol === 'https:' && 'serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function () { });
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () { });
    }
  </script>
</body>
</html>
